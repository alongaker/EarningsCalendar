name: Update earnings data

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch upcoming earnings
        run: node scripts/fetch-earnings.mjs
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Refresh earnings snapshot"
            git push
          fi

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Sheet — Upcoming earnings</title>
    <meta
      name="description"
      content="Upcoming earnings calls grouped by day, with consensus estimates, timing, and market cap."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__brand">
        <p class="kicker">Market calendar</p>
        <h1>Call Sheet</h1>
        <p class="lede">Who reports next, and when.</p>
      </div>
      <div class="masthead__meta">
        <p id="as-of">Loading calendar…</p>
        <p id="source-line">Nasdaq earnings calendar</p>
      </div>
    </header>

    <section id="lead" class="lead" aria-live="polite"></section>

    <section class="toolbar" aria-label="Filters">
      <label class="search">
        <span class="search__label">Search</span>
        <input
          id="q"
          type="search"
          placeholder="Ticker or company — press /"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <div class="filters" role="group" aria-label="Call time">
        <button class="chip is-on" data-time="all" type="button">All times</button>
        <button class="chip" data-time="before-open" type="button">Before open</button>
        <button class="chip" data-time="after-close" type="button">After close</button>
      </div>
      <div class="filters" role="group" aria-label="Market cap">
        <button class="chip is-on" data-cap="0" type="button">Any size</button>
        <button class="chip" data-cap="1000000000" type="button">$1B+</button>
        <button class="chip" data-cap="10000000000" type="button">$10B+</button>
        <button class="chip" data-cap="100000000000" type="button">$100B+</button>
      </div>
    </section>

    <nav id="week" class="week" aria-label="Days with earnings"></nav>

    <main id="board" class="board">
      <p class="status">Fetching the next few weeks of calls…</p>
    </main>

    <footer class="colophon">
      <p>
        Built for local preview with <code>npm start</code>, then GitHub Pages.
        Figures come from Nasdaq’s public earnings calendar and are not investment advice.
      </p>
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
